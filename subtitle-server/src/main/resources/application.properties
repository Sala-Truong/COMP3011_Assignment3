spring.application.name=cassette-backend

# Do not expose internal exception details to API clients
server.error.include-message=never

# Database
spring.datasource.url=jdbc:h2:file:./data/cassettedb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable development database console by default
spring.h2.console.enabled=false

# OpenAI API key supplied dynamically at runtime
openai.api.key=${OPENAI_API_KEY:}
# Assignment 3 uploads: small WAV clips (OpenAI's transcription limit is 25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy